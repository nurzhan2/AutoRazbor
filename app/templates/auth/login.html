<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — EuroRazbor</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
</head>
<body class="auth-body">
<div class="auth-card">
    <div class="auth-logo">
        <img src="/static/img/logo.jpg" alt="EuroRazbor">
    </div>
    <h1 class="auth-title">EuroRazbor</h1>
    <p class="auth-subtitle">Портал для оптовых клиентов</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="login" placeholder="Введите логин" required autofocus>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" placeholder="Введите пароль" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">Войти →</button>
    </form>
    <p class="auth-hint">Логин и пароль вы получили в Telegram-боте после оплаты.</p>
</div>
</body>
</html>
